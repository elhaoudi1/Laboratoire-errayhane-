name: Build Android AAB (Simplified Stable)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v18)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java (11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # خطوة تثبيت حزم المشروع ومزامنة Capacitor
      - name: Install and Sync
        run: |
          # التأكد من وجود ملف package.json (إذا قمت بإنشاء الملف فقط عبر web editor)
          if [ ! -f "package.json" ]; then
            echo "Initialisation de package.json..."
            npm init -y > /dev/null
          fi

          echo "Installation des dépendances..."
          npm ci > /dev/null || npm install > /dev/null

          echo "Configuration et Synchronisation de Capacitor..."
          # إعادة تهيئة المشروع بمعرف التطبيق ومسار الويب للتأكد من التكوين الصحيح
          npx cap init "Laboratoire Errayhane" "ma.errayhane.analyses" --web-dir=www > /dev/null

          # إضافة منصة Android إذا لم تكن موجودة
          if [ ! -d "android" ]; then
             echo "Ajout de la plateforme Android..."
             npx cap add android > /dev/null
          fi

          # مزامنة ملفات الويب مع مشروع Android
          npx cap sync android > /dev/null

      # خطوة بناء الحزمة (.aab) مع أمر التنظيف (clean)
      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew

          # تنفيذ أمر التنظيف أولاً لإزالة أي تضارب سابق
          echo "Nettoyage du projet Gradle (clean)..."
          ./gradlew clean

          # بناء الحزمة النهائية الموقعة (للنشر)
          echo "Construction du bundleRelease..."
          ./gradlew bundleRelease

      - name: Upload AAB artifact
        # رفع الملف الناتج
        uses: actions/upload-artifact@v4
        with:
          name: errayhane-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
